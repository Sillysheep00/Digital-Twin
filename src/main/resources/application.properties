# Spring Boot Application Configuration
spring.application.name=Digital Twin System

# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=digitaltwin

# Server Configuration
server.port=8080

# OpenWeatherMap API Configuration
weather.api.key=b4415f0ad8e49151c7ec5c754dccbe55
weather.api.url=https://api.openweathermap.org/data/2.5/weather

# Weather Location Configuration
weather.location.lat=51.5074
weather.location.lon=-0.1278
weather.location.name=London

# Weather API Settings
weather.cache.minutes=10
weather.fallback.enabled=true

# Logging Configuration
logging.level.com.fyp.digitaltwin=INFO
logging.level.org.springframework=WARN
logging.pattern.console=%d{HH:mm:ss} %-5level [%logger{1}] %msg%n
